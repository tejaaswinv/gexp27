name: Import GEXP Atlas 2027 project
on:
  push:
    branches: [main]
    paths:
      - '.gexp-import/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Validate and expand complete project archive
        shell: bash
        run: |
          set -euo pipefail
          cat .gexp-import/part-{01..11}.b64 | tr -d '\r\n' | base64 --decode > /tmp/gexp-atlas.zip
          echo '782948b9d370a881a7ba036dcf5f9cc8548b5fcd378bb7aa5ec4ef969360f681  /tmp/gexp-atlas.zip' | sha256sum -c -
          mkdir -p /tmp/gexp-atlas-import
          unzip -q /tmp/gexp-atlas.zip -d /tmp/gexp-atlas-import
          test -f /tmp/gexp-atlas-import/gexp-atlas/package.json
          cp -a /tmp/gexp-atlas-import/gexp-atlas/. .
          rm -rf .gexp-import
          rm -f .github/workflows/import-gexp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: import GEXP Atlas website with 2027 reference database and templates'
          git push origin HEAD:main
