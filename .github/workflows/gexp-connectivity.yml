name: GEXP connectivity diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/gexp-connectivity.yml']
permissions:
  contents: read
jobs:
  endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check custom domain and Vercel API routes
        shell: bash
        run: |
          set -uo pipefail
          cat >/tmp/profile.json <<'JSON'
          {"name":"Demo Student","studentId":"","gpa":3.56,"pillar":"CSD","tracks":["Artificial Intelligence"],"secondMajorHdi":false,"matriculationYear":2025,"hdiDomain":"","interests":"AI and software","region":"Europe","term":"fall","passport":"","homePlan":{"4":[{"code":"50.001","title":"Information Systems & Programming"}],"5":[],"7":[],"8":[]}}
          JSON
          failures=0
          for host in gexp.tejaaswinv.site gexp27.vercel.app; do
            echo "::group::Host: $host"
            for path in / /study-planner /api/catalog; do
              echo "Checking https://$host$path"
              curl --silent --show-error --location --max-time 20 --retry 1 \
                 -o /tmp/result-get -w 'status=%{http_code} duration=%{time_total}s size=%{size_download} bytes content-type=%{content_type}\n' \
                 "https://$host$path" || failures=$((failures+1))
              if [ "$path" = /study-planner ]; then
                if ! grep -qi "Eight terms" /tmp/result-get; then
                  echo "Study planner route did not render expected content"
                  failures=$((failures+1))
                fi
              fi
              if [ "$path" = /api/catalog ]; then
                node -e "try{const p=JSON.parse(require('fs').readFileSync('/tmp/result-get','utf8'));console.log('catalog university count',p.universities?.length??'none')}catch(e){console.log('non-JSON catalog response')}" || true
              fi
            done
            echo "Checking POST analysis (timeout 65 seconds)"
            curl --silent --show-error --location --max-time 65 \
                --header 'Content-Type: application/json' \
                --data-binary @/tmp/profile.json \
                --output /tmp/result-post \
                --write-out 'status=%{http_code} duration=%{time_total}s size=%{size_download} bytes content-type=%{content_type}\n' \
                "https://$host/api/analyze" || failures=$((failures+1))
            node -e "try{const p=JSON.parse(require('fs').readFileSync('/tmp/result-post','utf8'));console.log('analysis mode=',p.mode,'recommendations=',p.recommendations?.length??0,'error=',p.error||'none','notice=',(p.notices||[])[0]||'none')}catch(e){console.log('non-JSON analysis response')}" || true
            echo "Checking deterministic recovery endpoint"
            curl --silent --show-error --location --max-time 10 \
                --header 'Content-Type: application/json' \
                --data-binary @/tmp/profile.json \
                --output /tmp/result-rules \
                --write-out 'rules status=%{http_code} duration=%{time_total}s content-type=%{content_type}\n' \
                "https://$host/api/analyze?mode=rules" || failures=$((failures+1))
            node -e "try{const p=JSON.parse(require('fs').readFileSync('/tmp/result-rules','utf8'));console.log('rules mode=',p.mode,'recommendations=',p.recommendations?.length??0);if(p.mode!=='rules-based'||p.recommendations?.length!==4)process.exit(1)}catch(e){console.error('Recovery endpoint not working',e.message);process.exit(1)}" || failures=$((failures+1))
            echo "::endgroup::"
          done
          echo "curl failures=$failures"
          test "$failures" -eq 0
